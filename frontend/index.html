<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Personal Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f1115; color: #e6e6e6;
           display: flex; flex-direction: column; height: 100vh; }
    header { padding: 14px 20px; background: #1a1d24; border-bottom: 1px solid #2a2e38;
             display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    header h1 { font-size: 17px; font-weight: 600; }
    .controls { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    select, button { background: #2a2e38; color: #e6e6e6; border: 1px solid #3a3f4b;
                     padding: 7px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; }
    button:hover { background: #343945; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 75%; padding: 11px 14px; border-radius: 12px; line-height: 1.45; white-space: pre-wrap; }
    .user { align-self: flex-end; background: #2563eb; }
    .bot { align-self: flex-start; background: #20242d; }
    .meta { font-size: 11px; color: #8a909c; margin-top: 4px; }
    footer { padding: 14px 20px; background: #1a1d24; border-top: 1px solid #2a2e38; display: flex; gap: 10px; }
    #input { flex: 1; background: #0f1115; color: #e6e6e6; border: 1px solid #3a3f4b;
             padding: 11px 14px; border-radius: 10px; font-size: 14px; }
    #send { background: #2563eb; border: none; padding: 0 22px; }
    pre { background: #0b0d11; padding: 12px; border-radius: 8px; overflow-x: auto;
          font-size: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header>
    <h1>🤖 AI Personal Assistant</h1>
    <div class="controls">
      <label>Model:
        <select id="provider">
          <option value="frontier">Frontier (GPT)</option>
          <option value="oss">Open Source (Qwen)</option>
        </select>
      </label>
      <button id="ctx">/context</button>
      <button id="reset">Reset</button>
    </div>
  </header>

  <div id="chat"></div>

  <footer>
    <input id="input" placeholder="Type a message..." autocomplete="off">
    <button id="send">Send</button>
  </footer>

  <script>
    const sessionId = "web-" + Math.random().toString(36).slice(2, 10);
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");

    function add(text, cls, meta) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      if (meta) {
        const m = document.createElement("div");
        m.className = "meta";
        m.textContent = meta;
        div.appendChild(m);
      }
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function send() {
      const message = input.value.trim();
      if (!message) return;
      input.value = "";
      add(message, "user");
      const provider = document.getElementById("provider").value;
      const thinking = add("…", "bot");
      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message, provider }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || JSON.stringify(data));
        thinking.textContent = data.reply;
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `${data.provider} · ${data.latency_ms}ms · ${data.prompt_tokens}+${data.completion_tokens} tok`;
        thinking.appendChild(meta);
      } catch (e) {
        thinking.textContent = "⚠️ " + e.message;
      }
      chat.scrollTop = chat.scrollHeight;
    }

    async function showContext() {
      const res = await fetch("/context?session_id=" + sessionId);
      const data = await res.json();
      const div = add("", "bot");
      const pre = document.createElement("pre");
      pre.textContent = "/context\n" + JSON.stringify(data, null, 2);
      div.textContent = "";
      div.appendChild(pre);
      chat.scrollTop = chat.scrollHeight;
    }

    async function reset() {
      await fetch("/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId }),
      });
      chat.innerHTML = "";
      add("Memory cleared.", "bot");
    }

    document.getElementById("send").onclick = send;
    input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
    document.getElementById("ctx").onclick = showContext;
    document.getElementById("reset").onclick = reset;
  </script>
</body>
</html>
