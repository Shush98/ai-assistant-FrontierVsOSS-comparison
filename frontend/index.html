<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant Comparison</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0c12;
      --bg-glow-1: rgba(99, 102, 241, 0.07);
      --bg-glow-2: rgba(56, 189, 248, 0.05);
      --surface-1: #11141d;
      --surface-2: #171b26;
      --surface-3: #1e2330;
      --border: rgba(148, 163, 184, 0.12);
      --border-strong: rgba(148, 163, 184, 0.22);
      --text: #e8ecf4;
      --text-soft: #aab3c5;
      --text-faint: #7d8799;
      --primary: #6366f1;
      --primary-bright: #818cf8;
      --primary-deep: #4f46e5;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 9px;
      --shadow-1: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.25);
      --shadow-2: 0 2px 6px rgba(0,0,0,.45), 0 12px 32px rgba(0,0,0,.35);
      --ease: cubic-bezier(.22,.8,.36,1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      font-size: 15px;
      background:
        radial-gradient(1100px 500px at 18% -10%, var(--bg-glow-1), transparent 60%),
        radial-gradient(900px 460px at 85% -8%, var(--bg-glow-2), transparent 60%),
        var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Inline Lucide stroke icons */
    .ic {
      width: 16px; height: 16px;
      stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
      fill: none; flex-shrink: 0;
    }

    /* ---------- Header ---------- */
    header {
      padding: 14px 24px;
      background: linear-gradient(to bottom, rgba(23, 27, 38, 0.92), rgba(17, 20, 29, 0.92));
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow-1);
      z-index: 10;
    }
    .brand-mark {
      width: 34px; height: 34px;
      display: grid; place-items: center;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary-deep), #7c3aed);
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.35), inset 0 1px 0 rgba(255,255,255,.18);
      color: #fff;
    }
    .brand-mark .ic { width: 18px; height: 18px; }
    header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    header h1 small {
      display: block;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-faint);
      letter-spacing: 0.01em;
      margin-top: 1px;
    }
    header .tools-toggle {
      margin-left: auto;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-soft);
      display: flex; align-items: center; gap: 9px;
      cursor: pointer; user-select: none;
      padding: 7px 13px;
      border-radius: 99px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      transition: border-color .2s var(--ease), background .2s var(--ease);
    }
    .tools-toggle:hover { border-color: var(--border-strong); background: var(--surface-3); }
    /* checkbox -> switch (same input element, CSS only) */
    .tools-toggle input {
      appearance: none; -webkit-appearance: none;
      width: 34px; height: 19px;
      border-radius: 99px;
      background: var(--surface-3);
      border: 1px solid var(--border-strong);
      position: relative;
      cursor: pointer;
      transition: background .25s var(--ease), border-color .25s var(--ease);
      flex-shrink: 0;
    }
    .tools-toggle input::after {
      content: "";
      position: absolute;
      top: 2px; left: 2px;
      width: 13px; height: 13px;
      border-radius: 50%;
      background: var(--text-soft);
      transition: transform .25s var(--ease), background .25s var(--ease);
    }
    .tools-toggle input:checked {
      background: var(--primary-deep);
      border-color: var(--primary);
    }
    .tools-toggle input:checked::after {
      transform: translateX(15px);
      background: #fff;
    }
    .tools-toggle input:focus-visible {
      outline: 2px solid var(--primary-bright);
      outline-offset: 2px;
    }
    header .sid {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-faint);
      font-family: "JetBrains Mono", ui-monospace, monospace;
      padding: 6px 12px;
      border-radius: 99px;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }

    /* ---------- Comparison arena (primary action) ---------- */
    .arena {
      padding: 18px 24px;
      display: flex;
      justify-content: center;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(to bottom, rgba(17, 20, 29, 0.6), rgba(10, 12, 18, 0.2));
    }
    .arena .arena-inner {
      width: 100%; max-width: 860px;
      display: flex; gap: 10px; align-items: center;
      padding: 10px 12px 10px 18px;
      border-radius: var(--radius-lg);
      background: linear-gradient(var(--surface-2), var(--surface-2)) padding-box,
                  linear-gradient(120deg, rgba(99,102,241,.55), rgba(56,189,248,.35), rgba(52,211,153,.35)) border-box;
      border: 1px solid transparent;
      box-shadow: var(--shadow-2);
      transition: box-shadow .25s var(--ease);
    }
    .arena .arena-inner:focus-within {
      box-shadow: var(--shadow-2), 0 0 0 4px rgba(99, 102, 241, 0.16);
    }
    .arena .arena-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--primary-bright);
      white-space: nowrap;
      display: flex; align-items: center; gap: 7px;
      letter-spacing: 0.01em;
    }
    .arena input {
      flex: 1;
      background: transparent;
      color: var(--text);
      border: none;
      padding: 11px 8px;
      font-size: 14.5px;
      font-family: inherit;
      min-width: 0;
    }
    .arena input::placeholder { color: var(--text-faint); }
    .arena input:focus { outline: none; }
    .arena button {
      background: linear-gradient(135deg, var(--primary), var(--primary-deep));
      border: none;
      color: #fff;
      padding: 0 20px;
      border-radius: var(--radius-md);
      cursor: pointer;
      height: 42px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.35), inset 0 1px 0 rgba(255,255,255,.15);
      transition: filter .15s var(--ease), transform .1s var(--ease), box-shadow .2s var(--ease);
      white-space: nowrap;
    }
    .arena button:hover { filter: brightness(1.12); box-shadow: 0 4px 16px rgba(99, 102, 241, 0.45), inset 0 1px 0 rgba(255,255,255,.15); }
    .arena button:active { transform: scale(0.97); }
    .arena button:focus-visible { outline: 2px solid var(--primary-bright); outline-offset: 2px; }
    .arena button:disabled { opacity: 0.5; cursor: default; filter: none; transform: none; }

    /* ---------- Panels ---------- */
    .panels {
      flex: 1;
      display: flex;
      gap: 16px;
      padding: 16px 20px 20px;
      overflow: hidden;
      min-height: 0;
    }
    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--surface-1);
      min-width: 0;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-1);
      overflow: hidden;
    }
    .panel[data-provider="oss"] {
      --accent: #34d399;
      --accent-strong: #10b981;
      --accent-soft: rgba(52, 211, 153, 0.12);
      --accent-border: rgba(52, 211, 153, 0.35);
    }
    .panel[data-provider="frontier"] {
      --accent: #60a5fa;
      --accent-strong: #3b82f6;
      --accent-soft: rgba(96, 165, 250, 0.12);
      --accent-border: rgba(96, 165, 250, 0.35);
    }

    .panel-head {
      padding: 14px 18px;
      background: linear-gradient(to bottom, var(--surface-2), var(--surface-1));
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 11px;
      position: relative;
    }
    .panel-head::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), transparent 70%);
      opacity: .8;
    }
    .panel-head .dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      flex-shrink: 0;
    }
    .panel-head .name {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.01em;
    }
    .panel-head .tag {
      font-size: 11.5px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 99px;
      letter-spacing: 0.02em;
      border: 1px solid var(--accent-border);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .panel-head .actions { margin-left: auto; display: flex; gap: 7px; }
    .panel-head button {
      background: var(--surface-3);
      color: var(--text-soft);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: background .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease), transform .1s var(--ease);
    }
    .panel-head button .ic { width: 13px; height: 13px; }
    .panel-head button:hover {
      background: var(--surface-3);
      border-color: var(--accent-border);
      color: var(--text);
    }
    .panel-head button:active { transform: scale(0.96); }
    .panel-head button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---------- KPI stat tiles ---------- */
    .kpi {
      padding: 12px 16px;
      background: rgba(10, 12, 18, 0.45);
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
    }
    .kpi .stat, .kpi .rounds {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 11px;
      border-radius: var(--radius-md);
      background: var(--surface-2);
      border: 1px solid var(--border);
      min-width: 0;
      transition: border-color .2s var(--ease), background .2s var(--ease), transform .15s var(--ease);
      cursor: default;
    }
    .kpi .stat:hover, .kpi .rounds:hover {
      border-color: var(--accent-border);
      background: var(--surface-3);
      transform: translateY(-1px);
    }
    .kpi .stat .ic { width: 16px; height: 16px; color: var(--accent); opacity: .9; }
    .kpi .rounds .ic { width: 16px; height: 16px; color: var(--text-faint); }
    .kpi .stat-body {
      display: flex;
      flex-direction: column-reverse;
      min-width: 0;
      line-height: 1.25;
    }
    .kpi b {
      color: var(--text);
      font-weight: 700;
      font-size: 16px;
      font-variant-numeric: tabular-nums;
    }
    .kpi .stat-label {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .kpi .rounds { border-style: dashed; }

    /* ---------- Chat log ---------- */
    .log {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--surface-3) transparent;
    }
    .log::-webkit-scrollbar { width: 8px; }
    .log::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 99px; }
    .log::-webkit-scrollbar-track { background: transparent; }

    .msg {
      max-width: 85%;
      padding: 11px 15px;
      border-radius: 16px;
      line-height: 1.55;
      white-space: pre-wrap;
      font-size: 14.5px;
      overflow-wrap: break-word;
      animation: msg-in .22s var(--ease);
    }
    @keyframes msg-in {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .user {
      align-self: flex-end;
      background: linear-gradient(135deg,
        color-mix(in srgb, var(--accent-strong, var(--primary)) 38%, var(--surface-3)),
        color-mix(in srgb, var(--accent-strong, var(--primary)) 24%, var(--surface-2)));
      border: 1px solid var(--accent-border, var(--border-strong));
      border-bottom-right-radius: 6px;
      box-shadow: var(--shadow-1);
    }
    .bot {
      align-self: flex-start;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
      box-shadow: var(--shadow-1);
    }
    .meta {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-faint);
      margin-top: 8px;
      padding-top: 7px;
      border-top: 1px solid var(--border);
      letter-spacing: 0.01em;
      font-variant-numeric: tabular-nums;
    }
    .user .meta { border-top-color: rgba(255,255,255,.14); color: rgba(232,236,244,.75); }

    /* ---------- Compose ---------- */
    .compose {
      padding: 14px 16px;
      background: linear-gradient(to top, var(--surface-2), var(--surface-1));
      border-top: 1px solid var(--border);
      display: flex; gap: 9px;
    }
    .compose input {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border-strong);
      padding: 11px 15px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-family: inherit;
      min-width: 0;
      transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
    }
    .compose input::placeholder { color: var(--text-faint); }
    .compose input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .compose button {
      background: var(--accent-strong);
      border: 1px solid transparent;
      color: #fff;
      padding: 0 16px;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 600;
      font-family: inherit;
      display: flex; align-items: center; gap: 7px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 1px 6px color-mix(in srgb, var(--accent-strong) 35%, transparent);
      transition: filter .15s var(--ease), transform .1s var(--ease);
    }
    .compose button .ic { width: 14px; height: 14px; }
    .compose button:hover { filter: brightness(1.12); }
    .compose button:active { transform: scale(0.96); }
    .compose button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---------- Code / context blocks ---------- */
    pre {
      background: #07090d;
      padding: 13px 15px;
      border-radius: 10px;
      border: 1px solid var(--border);
      overflow-x: auto;
      font-size: 12.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #c9d4e3;
      scrollbar-width: thin;
      scrollbar-color: var(--surface-3) transparent;
    }

    ::selection { background: rgba(99, 102, 241, 0.35); }

    /* ---------- Voice input (mic) ---------- */
    /* Hidden by default; revealed by JS only when the browser supports SpeechRecognition,
       so unsupported browsers (e.g. Firefox) never show a dead button. */
    .mic {
      display: none;
      align-items: center; justify-content: center;
      flex-shrink: 0;
      width: 42px; height: 42px;
      border-radius: var(--radius-md);
      cursor: pointer;
      background: var(--surface-3);
      color: var(--text-soft);
      border: 1px solid var(--border-strong);
      transition: background .15s var(--ease), border-color .15s var(--ease),
                  color .15s var(--ease), transform .1s var(--ease);
    }
    body.voice-on .mic { display: inline-flex; }
    .mic .ic { width: 18px; height: 18px; }
    .mic:hover { color: var(--text); border-color: var(--primary); background: var(--surface-3); }
    .mic:active { transform: scale(0.94); }
    .mic:focus-visible { outline: 2px solid var(--primary-bright); outline-offset: 2px; }
    /* Compose mics are a touch smaller to match the compose row height. */
    .compose .mic { width: 40px; height: auto; align-self: stretch; }
    .compose .mic .ic { width: 16px; height: 16px; }
    /* Active recording state: red, pulsing, with a stop-ring. */
    .mic.recording {
      color: #fff;
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      border-color: #fb7185;
      box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.55);
      animation: mic-pulse 1.4s var(--ease) infinite;
    }
    @keyframes mic-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.5); }
      70%  { box-shadow: 0 0 0 9px rgba(244, 63, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
    }
    .arena .mic { height: 42px; }

    /* ---------- Responsive ---------- */
    @media (max-width: 1100px) {
      .kpi { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 880px) {
      .panels { flex-direction: column; overflow-y: auto; }
      .panel { min-height: 480px; }
      header { flex-wrap: wrap; }
      header .sid { display: none; }
      .arena .arena-label span { display: none; }
    }
    @media (max-width: 560px) {
      .kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .panels { padding: 12px; gap: 12px; }
      .arena { padding: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-mark">
      <svg class="ic" viewBox="0 0 24 24"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
    </div>
    <h1>AI Assistant Comparison<small>Open-source vs frontier, side by side</small></h1>
    <label class="tools-toggle" title="When on, either model may call tools (weather, calc, etc.). When off, no tools are used — faster.">
      <svg class="ic" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      Tools
      <input type="checkbox" id="toolsToggle" checked>
    </label>
    <span class="sid" id="sid"></span>
  </header>

  <!-- Comparison arena: shared prompt -> both models at once. KPIs only count these sends. -->
  <div class="arena">
    <div class="arena-inner">
      <span class="arena-label">
        <svg class="ic" viewBox="0 0 24 24"><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" x2="19" y1="19" y2="13"/><line x1="16" x2="20" y1="16" y2="20"/><line x1="19" x2="21" y1="21" y2="19"/><polyline points="14.5 6.5 18 3 21 3 21 6 17.5 10"/><line x1="5" x2="9" y1="14" y2="18"/><line x1="7" x2="4" y1="17" y2="20"/><line x1="3" x2="5" y1="19" y2="21"/></svg>
        <span>Compare both</span>
      </span>
      <input id="arenaInput" placeholder="Send one prompt to BOTH assistants (KPI cards count only these)…" autocomplete="off">
      <button class="mic" data-mic="arena" type="button" title="Speak your prompt" aria-label="Voice input">
        <svg class="ic mic-idle" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
        <svg class="ic mic-stop" viewBox="0 0 24 24" style="display:none"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
      <button id="arenaSend">
        <svg class="ic" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>
        Send to both
      </button>
    </div>
  </div>

  <div class="panels">
    <!-- OSS panel -->
    <div class="panel" data-provider="oss">
      <div class="panel-head">
        <span class="dot"></span>
        <span class="name">Open Source</span>
        <span class="tag oss">Qwen2.5-0.5B</span>
        <div class="actions">
          <button data-act="ctx">
            <svg class="ic" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></svg>
            /context
          </button>
          <button data-act="reset">
            <svg class="ic" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            Reset
          </button>
        </div>
      </div>
      <div class="kpi" data-kpi="oss">
        <span class="stat" title="Times a guardrail (input blocklist or output moderation) fired">

      </div>
      <div class="log"></div>
      <div class="compose">
        <input placeholder="Message Qwen…  (try /remember <fact> or /recall)" autocomplete="off">
        <button class="mic" data-mic="panel" type="button" title="Speak your message" aria-label="Voice input">
          <svg class="ic mic-idle" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
          <svg class="ic mic-stop" viewBox="0 0 24 24" style="display:none"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
        <button data-act="send">
          <svg class="ic" viewBox="0 0 24 24"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>

    <!-- Frontier panel -->
    <div class="panel" data-provider="frontier">
      <div class="panel-head">
        <span class="dot"></span>
        <span class="name">Frontier</span>
        <span class="tag frontier">GPT (OpenAI)</span>
        <div class="actions">
          <button data-act="ctx">
            <svg class="ic" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></svg>
            /context
          </button>
          <button data-act="reset">
            <svg class="ic" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            Reset
          </button>
        </div>
      </div>
      <div class="kpi" data-kpi="frontier">
        <span class="stat" title="Times a guardrail (input blocklist or output moderation) fired">
          <svg class="ic" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
          <span class="stat-body"><b data-k="guardrail">0</b><span class="stat-label">Guardrail</span></span>
        </span>
        <span class="stat" title="Times the model called a tool">
          <svg class="ic" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          <span class="stat-body"><b data-k="tools">0</b><span class="stat-label">Tools</span></span>

          <svg class="ic" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
          <span class="stat-body"><b data-k="errors">0</b><span class="stat-label">Errors</span></span>

          <svg class="ic" viewBox="0 0 24 24"><path d="M9 10h.01"/><path d="M15 10h.01"/><path d="M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8"/></svg>
          <span class="stat-body"><b data-k="halluc">0</b><span class="stat-label">Halluc.</span></span>
        </span>

          <svg class="ic" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
          <span class="stat-body"><b data-k="rounds">0</b><span class="stat-label">Rounds</span></span>

      <div class="log"></div>
      <div class="compose">
        <input placeholder="Message GPT…  (try /remember <fact> or /recall)" autocomplete="off">
        <button class="mic" data-mic="panel" type="button" title="Speak your message" aria-label="Voice input">
          <svg class="ic mic-idle" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
          <svg class="ic mic-stop" viewBox="0 0 24 24" style="display:none"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
        <button data-act="send">
          <svg class="ic" viewBox="0 0 24 24"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>
          Send
        </button>
      </div>
    </div>
  </div>

  <script>
    const sessionId = "web-" + Math.random().toString(36).slice(2, 10);
    document.getElementById("sid").textContent = "session: " + sessionId;

    function add(log, text, cls, meta) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      if (meta) {
        const m = document.createElement("div");
        m.className = "meta";
        m.textContent = meta;
        div.appendChild(m);
      }
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    // send() drives one panel. Refactored to take an explicit `text` (defaults to the
    // panel's own input) and return its result, so the arena can reuse it for a fan-out
    // without changing the existing per-panel behaviour. `opts` is reserved (e.g. countKpi
    // is handled by the caller in arenaSend, not here).
    async function send(panel, text, opts) {
      const provider = panel.dataset.provider;
      const input = panel.querySelector(".compose input");
      const log = panel.querySelector(".log");
      const fromInput = (text === undefined);
      const message = (fromInput ? input.value : text).trim();
      if (!message) return null;
      if (fromInput) input.value = "";
      add(log, message, "user");
      const thinking = add(log, "…", "bot");
      let data = null, errored = false;
      try {
        const toolsEnabled = document.getElementById("toolsToggle").checked;
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message, provider, tools_enabled: toolsEnabled }),
        });
        data = await res.json();
        if (!res.ok) throw new Error(data.detail || JSON.stringify(data));
        thinking.textContent = data.reply;
        const m = document.createElement("div");
        m.className = "meta";
        const tool = data.tool_used ? ` · 🔧 ${data.tool_used}` : "";
        // OSS reports a true model-latency vs transport-overhead split; frontier doesn't.
        const split = (data.server_ms != null)
          ? ` · ⚙️ ${data.server_ms}ms model / ${data.overhead_ms}ms overhead` : "";
        m.textContent = `${data.provider} · ${data.latency_ms}ms · ${data.prompt_tokens}+${data.completion_tokens} tok${tool}${split}`;
        thinking.appendChild(m);
      } catch (e) {
        thinking.textContent = "⚠️ " + e.message;
        errored = true;
      }
      log.scrollTop = log.scrollHeight;
      return { provider, prompt: message, reply: data ? data.reply : null, data, errored };
    }

    async function showContext(panel) {
      const provider = panel.dataset.provider;
      const log = panel.querySelector(".log");
      const res = await fetch(`/context?session_id=${sessionId}&provider=${provider}`);
      const data = await res.json();
      const div = add(log, "", "bot");
      const pre = document.createElement("pre");
      pre.textContent = "/context\n" + JSON.stringify(data, null, 2);
      div.appendChild(pre);
      log.scrollTop = log.scrollHeight;
    }

    async function reset(panel) {
      const provider = panel.dataset.provider;
      const log = panel.querySelector(".log");
      await fetch("/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, provider }),
      });
      log.innerHTML = "";
      add(log, "Memory cleared.", "bot");
    }

    // --- Comparison arena: shared input -> both models, with cumulative KPI tallies. ---
    // Exact text returned by app/guardrails.refusal_message() — a guardrail refusal counts
    // as a refusal without needing the judge.
    const REFUSAL_TEXT = "I can't help with that request. If you're in distress, please reach out to a local emergency line or a mental-health professional.";

    // Single source of truth for the cumulative counts (per provider). Counts only ever
    // grow across common-input rounds; individual-panel sends never touch this.
    const kpi = {
      oss:      { rounds: 0, guardrail: 0, tools: 0, errors: 0, halluc: 0, refused: 0 },
      frontier: { rounds: 0, guardrail: 0, tools: 0, errors: 0, halluc: 0, refused: 0 },
    };

    function renderKpi(provider) {
      const card = document.querySelector(`.kpi[data-kpi="${provider}"]`);
      const s = kpi[provider];
      card.querySelectorAll("b[data-k]").forEach(b => {
        b.textContent = s[b.dataset.k];
      });
    }

    // Update one panel's cumulative tallies from its /chat result, then fire the live judge.
    async function tallyKpi(result) {
      if (!result) return;
      const p = result.provider;
      const s = kpi[p];
      s.rounds += 1;
      const data = result.data || {};
      let guardrailRefusal = false;
      if (result.errored || data.error === true) {
        s.errors += 1;
      } else {
        if (data.guardrail) s.guardrail += 1;
        if (data.tool_used) s.tools += 1;
        if (data.reply === REFUSAL_TEXT) { s.refused += 1; guardrailRefusal = true; }
      }
      renderKpi(p);  // show the free signals immediately

      // Judged metrics (hallucination / self-refusal) via the additive /analyze endpoint.
      // Skip when there was an error or it was already a guardrail refusal (nothing to judge
      // / avoid double-counting refusals). Fail-safe: errors here just leave judged KPIs as-is.
      if (result.errored || guardrailRefusal || !result.reply) return;
      try {
        const res = await fetch("/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt: result.prompt,
            reply: result.reply,
            tool_used: (result.data && result.data.tool_used) || null,
            session_id: sessionId,
            provider: p,
          }),
        });
        const a = await res.json();
        if (a.hallucinated) s.halluc += 1;
        if (a.refused) s.refused += 1;
        renderKpi(p);
      } catch (e) { /* fail-safe: leave judged tallies unchanged */ }
    }

    const arenaInput = document.getElementById("arenaInput");
    const arenaBtn = document.getElementById("arenaSend");

    async function arenaSend() {
      const text = arenaInput.value.trim();
      if (!text) return;
      arenaInput.value = "";
      arenaBtn.disabled = true;
      const panels = [...document.querySelectorAll(".panel")];
      // Fan out the SAME prompt to both panels at once; it appears live in both logs.
      // Tally each panel's result independently as it resolves.
      await Promise.all(panels.map(panel =>
        send(panel, text, { countKpi: true }).then(tallyKpi)
      ));
      arenaBtn.disabled = false;
      arenaInput.focus();
    }

    arenaBtn.onclick = arenaSend;
    arenaInput.addEventListener("keydown", e => { if (e.key === "Enter") arenaSend(); });

    document.querySelectorAll(".panel").forEach(panel => {
      panel.querySelector('[data-act="send"]').onclick = () => send(panel);
      panel.querySelector(".compose input").addEventListener("keydown", e => {
        if (e.key === "Enter") send(panel);
      });
      panel.querySelector('[data-act="ctx"]').onclick = () => showContext(panel);
      panel.querySelector('[data-act="reset"]').onclick = () => reset(panel);
    });

    // --- Voice input (Web Speech API) — FRONTEND-ONLY. ---------------------------------
    // Pure UI sugar: it only writes the transcript into an existing <input>; sending still
    // goes through the unchanged send()/arenaSend(). Backend + /chat contract untouched.
    // Output stays text (no speech synthesis). Gracefully no-ops where unsupported.
    (function setupVoice() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return;  // e.g. Firefox: leave mic buttons hidden, nothing breaks.
      document.body.classList.add("voice-on");  // reveal the mic buttons

      let active = null;  // the single in-flight recognizer (one mic at a time)

      function targetInput(micBtn) {
        return micBtn.dataset.mic === "arena"
          ? arenaInput
          : micBtn.closest(".panel").querySelector(".compose input");
      }

      function setRecording(micBtn, on) {
        micBtn.classList.toggle("recording", on);
        micBtn.querySelector(".mic-idle").style.display = on ? "none" : "";
        micBtn.querySelector(".mic-stop").style.display = on ? "" : "none";
        micBtn.title = on ? "Stop recording" : (micBtn.dataset.mic === "arena"
          ? "Speak your prompt" : "Speak your message");
      }

      function startMic(micBtn) {
        const input = targetInput(micBtn);
        const rec = new SR();
        rec.lang = "en-US";
        rec.interimResults = true;   // show words as they're recognized
        rec.continuous = false;      // single utterance, then auto-stop
        const base = input.value ? input.value.trim() + " " : "";

        rec.onresult = (e) => {
          let transcript = "";
          for (let i = 0; i < e.results.length; i++) transcript += e.results[i][0].transcript;
          input.value = base + transcript;  // live-fill; user can still edit/Enter to send
        };
        rec.onerror = (e) => {
          // no-speech / not-allowed / aborted — fail quietly; just drop the recording state.
          if (e.error === "not-allowed" || e.error === "service-not-allowed") {
            input.placeholder = "Microphone blocked — allow mic access to use voice.";
          }
        };
        rec.onend = () => { setRecording(micBtn, false); active = null; input.focus(); };

        active = { rec, btn: micBtn };
        setRecording(micBtn, true);
        try { rec.start(); }
        catch (_) { setRecording(micBtn, false); active = null; }
      }

      document.querySelectorAll(".mic").forEach(micBtn => {
        micBtn.addEventListener("click", () => {
          // If this mic is already recording, stop it. If another is, stop that first.
          if (active && active.btn === micBtn) { active.rec.stop(); return; }
          if (active) active.rec.stop();
          startMic(micBtn);
        });
      });
    })();
  </script>
