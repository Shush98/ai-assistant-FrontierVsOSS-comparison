<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant Comparison</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f1115; color: #e6e6e6;
           display: flex; flex-direction: column; height: 100vh; }
    header { padding: 14px 20px; background: #1a1d24; border-bottom: 1px solid #2a2e38;
             display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 17px; font-weight: 600; }
    header .tools-toggle { margin-left: auto; font-size: 12px; color: #b8bdc8;
                           display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    header .tools-toggle input { cursor: pointer; }
    header .sid { font-size: 12px; color: #8a909c; }
    /* Comparison arena: one shared input that fans out to BOTH models. */
    .arena { padding: 12px 16px; background: #161922; border-bottom: 1px solid #2a2e38;
             display: flex; justify-content: center; }
    .arena .arena-inner { width: 100%; max-width: 720px; display: flex; gap: 8px; align-items: center; }
    .arena .arena-label { font-size: 12px; color: #8a909c; white-space: nowrap; }
    .arena input { flex: 1; background: #0f1115; color: #e6e6e6; border: 1px solid #3a3f4b;
                   padding: 10px 12px; border-radius: 9px; font-size: 14px; min-width: 0; }
    .arena button { background: #2563eb; border: none; color: #fff; padding: 0 18px;
                    border-radius: 9px; cursor: pointer; height: 38px; }
    .arena button:disabled { opacity: 0.55; cursor: default; }
    /* Per-model KPI card (cumulative tallies across common-input rounds). */
    .kpi { padding: 8px 16px; background: #12151c; border-bottom: 1px solid #2a2e38;
           display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .kpi .stat { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: #20242d;
                 color: #cdd2dc; border: 1px solid #2a2e38; }
    .kpi .stat b { color: #fff; font-weight: 600; }
    .kpi .rounds { margin-left: auto; font-size: 11px; color: #8a909c; }
    .panels { flex: 1; display: flex; gap: 1px; background: #2a2e38; overflow: hidden; }
    .panel { flex: 1; display: flex; flex-direction: column; background: #0f1115; min-width: 0; }
    .panel-head { padding: 12px 16px; background: #161922; border-bottom: 1px solid #2a2e38;
                  display: flex; align-items: center; gap: 10px; }
    .panel-head .name { font-weight: 600; font-size: 14px; }
    .panel-head .tag { font-size: 11px; padding: 2px 8px; border-radius: 6px; }
    .tag.oss { background: #14532d; color: #86efac; }
    .tag.frontier { background: #1e3a5f; color: #93c5fd; }
    .panel-head .actions { margin-left: auto; display: flex; gap: 6px; }
    .panel-head button { background: #2a2e38; color: #e6e6e6; border: 1px solid #3a3f4b;
                         padding: 5px 10px; border-radius: 7px; font-size: 12px; cursor: pointer; }
    .panel-head button:hover { background: #343945; }
    .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 85%; padding: 10px 13px; border-radius: 11px; line-height: 1.45; white-space: pre-wrap; font-size: 14px; }
    .user { align-self: flex-end; background: #2563eb; }
    .bot { align-self: flex-start; background: #20242d; }
    .meta { font-size: 11px; color: #8a909c; margin-top: 4px; }
    .compose { padding: 12px 16px; background: #161922; border-top: 1px solid #2a2e38; display: flex; gap: 8px; }
    .compose input { flex: 1; background: #0f1115; color: #e6e6e6; border: 1px solid #3a3f4b;
                     padding: 10px 12px; border-radius: 9px; font-size: 14px; min-width: 0; }
    .compose button { background: #2563eb; border: none; color: #fff; padding: 0 18px; border-radius: 9px; cursor: pointer; }
    pre { background: #0b0d11; padding: 11px; border-radius: 8px; overflow-x: auto; font-size: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header>
    <h1>🤖 AI Assistant Comparison</h1>
    <label class="tools-toggle" title="When on, either model may call tools (weather, calc, etc.). When off, no tools are used — faster.">
      <input type="checkbox" id="toolsToggle" checked> 🔧 Tools
    </label>
    <span class="sid" id="sid"></span>
  </header>

  <!-- Comparison arena: shared prompt -> both models at once. KPIs only count these sends. -->
  <div class="arena">
    <div class="arena-inner">
      <span class="arena-label">⚔️ Compare both:</span>
      <input id="arenaInput" placeholder="Send one prompt to BOTH assistants (KPI cards count only these)…" autocomplete="off">
      <button id="arenaSend">Send to both</button>
    </div>
  </div>

  <div class="panels">
    <!-- OSS panel -->
    <div class="panel" data-provider="oss">
      <div class="panel-head">
        <span class="name">Open Source</span>
        <span class="tag oss">Qwen2.5-0.5B</span>
        <div class="actions">
          <button data-act="ctx">/context</button>
          <button data-act="reset">Reset</button>
        </div>
      </div>
      <div class="kpi" data-kpi="oss">
        <span class="stat" title="Times a guardrail (input blocklist or output moderation) fired">🛡️ Guardrail <b data-k="guardrail">0</b></span>
        <span class="stat" title="Times the model called a tool">🔧 Tools <b data-k="tools">0</b></span>
        <span class="stat" title="Times the model errored / degraded">⚠️ Errors <b data-k="errors">0</b></span>
        <span class="stat" title="Times the live judge flagged a hallucination">🌀 Halluc. <b data-k="halluc">0</b></span>
        <span class="stat" title="Times the model refused / declined">🙅 Refused <b data-k="refused">0</b></span>
        <span class="rounds">rounds: <b data-k="rounds">0</b></span>
      </div>
      <div class="log"></div>
      <div class="compose">
        <input placeholder="Message Qwen…  (try /remember <fact> or /recall)" autocomplete="off">
        <button data-act="send">Send</button>
      </div>
    </div>

    <!-- Frontier panel -->
    <div class="panel" data-provider="frontier">
      <div class="panel-head">
        <span class="name">Frontier</span>
        <span class="tag frontier">GPT (OpenAI)</span>
        <div class="actions">
          <button data-act="ctx">/context</button>
          <button data-act="reset">Reset</button>
        </div>
      </div>
      <div class="kpi" data-kpi="frontier">
        <span class="stat" title="Times a guardrail (input blocklist or output moderation) fired">🛡️ Guardrail <b data-k="guardrail">0</b></span>
        <span class="stat" title="Times the model called a tool">🔧 Tools <b data-k="tools">0</b></span>
        <span class="stat" title="Times the model errored / degraded">⚠️ Errors <b data-k="errors">0</b></span>
        <span class="stat" title="Times the live judge flagged a hallucination">🌀 Halluc. <b data-k="halluc">0</b></span>
        <span class="stat" title="Times the model refused / declined">🙅 Refused <b data-k="refused">0</b></span>
        <span class="rounds">rounds: <b data-k="rounds">0</b></span>
      </div>
      <div class="log"></div>
      <div class="compose">
        <input placeholder="Message GPT…  (try /remember <fact> or /recall)" autocomplete="off">
        <button data-act="send">Send</button>
      </div>
    </div>
  </div>

  <script>
    const sessionId = "web-" + Math.random().toString(36).slice(2, 10);
    document.getElementById("sid").textContent = "session: " + sessionId;

    function add(log, text, cls, meta) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      if (meta) {
        const m = document.createElement("div");
        m.className = "meta";
        m.textContent = meta;
        div.appendChild(m);
      }
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    // send() drives one panel. Refactored to take an explicit `text` (defaults to the
    // panel's own input) and return its result, so the arena can reuse it for a fan-out
    // without changing the existing per-panel behaviour. `opts` is reserved (e.g. countKpi
    // is handled by the caller in arenaSend, not here).
    async function send(panel, text, opts) {
      const provider = panel.dataset.provider;
      const input = panel.querySelector(".compose input");
      const log = panel.querySelector(".log");
      const fromInput = (text === undefined);
      const message = (fromInput ? input.value : text).trim();
      if (!message) return null;
      if (fromInput) input.value = "";
      add(log, message, "user");
      const thinking = add(log, "…", "bot");
      let data = null, errored = false;
      try {
        const toolsEnabled = document.getElementById("toolsToggle").checked;
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message, provider, tools_enabled: toolsEnabled }),
        });
        data = await res.json();
        if (!res.ok) throw new Error(data.detail || JSON.stringify(data));
        thinking.textContent = data.reply;
        const m = document.createElement("div");
        m.className = "meta";
        const tool = data.tool_used ? ` · 🔧 ${data.tool_used}` : "";
        // OSS reports a true model-latency vs transport-overhead split; frontier doesn't.
        const split = (data.server_ms != null)
          ? ` · ⚙️ ${data.server_ms}ms model / ${data.overhead_ms}ms overhead` : "";
        m.textContent = `${data.provider} · ${data.latency_ms}ms · ${data.prompt_tokens}+${data.completion_tokens} tok${tool}${split}`;
        thinking.appendChild(m);
      } catch (e) {
        thinking.textContent = "⚠️ " + e.message;
        errored = true;
      }
      log.scrollTop = log.scrollHeight;
      return { provider, prompt: message, reply: data ? data.reply : null, data, errored };
    }

    async function showContext(panel) {
      const provider = panel.dataset.provider;
      const log = panel.querySelector(".log");
      const res = await fetch(`/context?session_id=${sessionId}&provider=${provider}`);
      const data = await res.json();
      const div = add(log, "", "bot");
      const pre = document.createElement("pre");
      pre.textContent = "/context\n" + JSON.stringify(data, null, 2);
      div.appendChild(pre);
      log.scrollTop = log.scrollHeight;
    }

    async function reset(panel) {
      const provider = panel.dataset.provider;
      const log = panel.querySelector(".log");
      await fetch("/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, provider }),
      });
      log.innerHTML = "";
      add(log, "Memory cleared.", "bot");
    }

    // --- Comparison arena: shared input -> both models, with cumulative KPI tallies. ---
    // Exact text returned by app/guardrails.refusal_message() — a guardrail refusal counts
    // as a refusal without needing the judge.
    const REFUSAL_TEXT = "I can't help with that request. If you're in distress, please reach out to a local emergency line or a mental-health professional.";

    // Single source of truth for the cumulative counts (per provider). Counts only ever
    // grow across common-input rounds; individual-panel sends never touch this.
    const kpi = {
      oss:      { rounds: 0, guardrail: 0, tools: 0, errors: 0, halluc: 0, refused: 0 },
      frontier: { rounds: 0, guardrail: 0, tools: 0, errors: 0, halluc: 0, refused: 0 },
    };

    function renderKpi(provider) {
      const card = document.querySelector(`.kpi[data-kpi="${provider}"]`);
      const s = kpi[provider];
      card.querySelectorAll("b[data-k]").forEach(b => {
        b.textContent = s[b.dataset.k];
      });
    }

    // Update one panel's cumulative tallies from its /chat result, then fire the live judge.
    async function tallyKpi(result) {
      if (!result) return;
      const p = result.provider;
      const s = kpi[p];
      s.rounds += 1;
      const data = result.data || {};
      let guardrailRefusal = false;
      if (result.errored || data.error === true) {
        s.errors += 1;
      } else {
        if (data.guardrail) s.guardrail += 1;
        if (data.tool_used) s.tools += 1;
        if (data.reply === REFUSAL_TEXT) { s.refused += 1; guardrailRefusal = true; }
      }
      renderKpi(p);  // show the free signals immediately

      // Judged metrics (hallucination / self-refusal) via the additive /analyze endpoint.
      // Skip when there was an error or it was already a guardrail refusal (nothing to judge
      // / avoid double-counting refusals). Fail-safe: errors here just leave judged KPIs as-is.
      if (result.errored || guardrailRefusal || !result.reply) return;
      try {
        const res = await fetch("/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt: result.prompt,
            reply: result.reply,
            tool_used: (result.data && result.data.tool_used) || null,
            session_id: sessionId,
            provider: p,
          }),
        });
        const a = await res.json();
        if (a.hallucinated) s.halluc += 1;
        if (a.refused) s.refused += 1;
        renderKpi(p);
      } catch (e) { /* fail-safe: leave judged tallies unchanged */ }
    }

    const arenaInput = document.getElementById("arenaInput");
    const arenaBtn = document.getElementById("arenaSend");

    async function arenaSend() {
      const text = arenaInput.value.trim();
      if (!text) return;
      arenaInput.value = "";
      arenaBtn.disabled = true;
      const panels = [...document.querySelectorAll(".panel")];
      // Fan out the SAME prompt to both panels at once; it appears live in both logs.
      // Tally each panel's result independently as it resolves.
      await Promise.all(panels.map(panel =>
        send(panel, text, { countKpi: true }).then(tallyKpi)
      ));
      arenaBtn.disabled = false;
      arenaInput.focus();
    }

    arenaBtn.onclick = arenaSend;
    arenaInput.addEventListener("keydown", e => { if (e.key === "Enter") arenaSend(); });

    document.querySelectorAll(".panel").forEach(panel => {
      panel.querySelector('[data-act="send"]').onclick = () => send(panel);
      panel.querySelector(".compose input").addEventListener("keydown", e => {
        if (e.key === "Enter") send(panel);
      });
      panel.querySelector('[data-act="ctx"]').onclick = () => showContext(panel);
      panel.querySelector('[data-act="reset"]').onclick = () => reset(panel);
    });
  </script>
</body>
</html>
